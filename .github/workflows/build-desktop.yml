# Builds the Parley desktop app for Mac (.dmg) and Windows (.exe installer).
# Runs when you push a tag like v1.0.0, or manually from the GitHub "Actions" tab.
# Download the results from the run's "Artifacts" section (and from the Release when tagged).
name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            artifact: Parley-mac
            files: app/dist/*.dmg
          - os: windows-latest
            target: --win
            artifact: Parley-windows
            files: app/dist/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never
        # No paid Apple/Windows certificates: Mac gets an ad-hoc signature, Windows is unsigned.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
