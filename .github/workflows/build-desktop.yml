# Builds the Parley desktop app for Mac (.dmg + .zip) and Windows (.exe installer).
# Runs when you push a tag like v1.2.0, or manually from the GitHub "Actions" tab.
# Download the results from the run's "Artifacts" section (and from the Release when tagged).
#
# Auto-update reads the *latest GitHub Release* through your Parley server, so every
# tagged release must include: latest.yml + the .exe (+ .blockmap) for Windows, and the
# -mac.zip for Mac. This workflow attaches all of them.
name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            artifact: Parley-mac
            files: |
              app/dist/*.dmg
              app/dist/*-mac.zip
              app/dist/latest-mac.yml
          - os: windows-latest
            target: --win
            artifact: Parley-windows
            files: |
              app/dist/*.exe
              app/dist/*.exe.blockmap
              app/dist/latest.yml
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never
        # No paid Apple/Windows certificates: Mac gets an ad-hoc signature, Windows is unsigned.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: warn
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          fail_on_unmatched_files: false
